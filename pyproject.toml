[project]
name = "policylens"
version = "0.1.0"
description = "LLM extracts coverage from a health policy; a deterministic engine computes the payout."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "pymupdf>=1.24",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
postgres = ["psycopg[binary]>=3.2"]

[tool.setuptools]
packages = ["app", "engine", "evals"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends()/File()/Form() defaults are the idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
